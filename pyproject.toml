[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dj"
version = "0.1.0"
description = "Autonomous AI DJ engine for Windows 11: deterministic planning, beat-aligned transitions, measurable verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent" }]
keywords = ["dj", "mixing", "audio", "beatmatching", "music", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]

[tool.setuptools]
packages = ["ai_dj", "ai_dj.analysis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF", "PL"]
ignore = [
    "PLR0913", # too many arguments: CLI/parsers legitimately take several
    "PLR2004", # magic values in threshold contracts are documented constants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
