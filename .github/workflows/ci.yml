name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --quiet --only-binary :all: ruff==0.17.0
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Python syntax check
        run: python -m compileall -q ai_dj scripts tests
      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json, pathlib
          for name in (".orchestrator/TASKS.json", "evidence/timing_probe.json"):
              p = pathlib.Path(name)
              if p.exists():
                  json.loads(p.read_text(encoding="utf-8"))
                  print("valid:", name)
              else:
                  print("absent (ok):", name)
          PY

  test:
    name: Test (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --quiet --only-binary :all: -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  e2e:
    name: E2E — timing gate (synthetic ground truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --only-binary :all: -r requirements.txt
      - name: Ensure ffmpeg with rubberband
        run: |
          which ffmpeg
          ffmpeg -hide_banner -filters | grep -q rubberband && echo "rubberband: present"
      - name: Run timing probe (gate G2a)
        run: |
          set -e
          python scripts/timing_probe.py --bpm 120 --tempo 1.08 --out evidence/timing_probe.json
      - name: Run full suite with ffmpeg available
        run: python -m unittest discover -s tests -v
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-evidence
          path: evidence/timing_probe.json
          if-no-files-found: warn
